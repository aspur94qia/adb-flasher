name: build-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: gradle assembleWithrootDebug assembleNorootDebug --no-daemon --stacktrace
      - name: Rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/withroot/debug/app-withroot-debug.apk adb-flasher-root.apk
          cp app/build/outputs/apk/noroot/debug/app-noroot-debug.apk adb-flasher-nonroot.apk
          ls -l *.apk
          gh release create "apk-${{ github.run_number }}" adb-flasher-root.apk adb-flasher-nonroot.apk --title "ADB Flasher ${{ github.run_number }}" --notes "Dua versi: root dan non-root"
