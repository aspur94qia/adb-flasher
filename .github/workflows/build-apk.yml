name: build-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk adb-flasher-full.apk
          ls -l adb-flasher-full.apk
          gh release create "apk-${{ github.run_number }}" adb-flasher-full.apk --title "ADB Flasher Full ${{ github.run_number }}" --notes "Satu APK: root dan non-root"
