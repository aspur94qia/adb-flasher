plugins { id 'com.android.application' }
android {
    namespace 'com.aspur.adbflasher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aspur.adbflasher'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'mode'
    productFlavors {
        withroot {
            dimension 'mode'
            applicationIdSuffix '.root'
            buildConfigField 'boolean', 'ROOT_MODE', 'true'
            resValue 'string', 'app_name', 'ADB Flasher Root'
        }
        noroot {
            dimension 'mode'
            applicationIdSuffix '.nonroot'
            buildConfigField 'boolean', 'ROOT_MODE', 'false'
            resValue 'string', 'app_name', 'ADB Flasher Non-root'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
